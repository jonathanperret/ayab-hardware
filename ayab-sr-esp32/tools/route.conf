# Autorouting settings for scripts/kicad/route/route.sh (sourced by bash).
#   scripts/kicad/route/route.sh ayab-sr-esp32/ayab-sr-esp32.kicad_pcb /tmp/route ayab-sr-esp32/tools/route.conf
# Pass A routes these nets first (power, plus GND so its SMD pads get short stubs), at their class widths.
POWER_NETS='+15V,/Vout,/Vsol,Net-(U6-SW),+5V,+3.3V,Net-(D1-K),/USB2_VBUS,Net-(U9-SW),GND'
# Short pad-to-pad links Freerouting handles badly: USB-C D+/D- bridges, bootstrap cap, shunt Kelvin pair.
PRE_ROUTES='J2:A6 J2:B6 0.2; J2:A7 J2:B7 0.2; U9:6 C9:1 0.25; U7:10 R6:2 0.25; U7:1 R6:1 0.25'
# Pass B: the remaining power-class tracks are narrowed so they still fit (um).
PASS_B_WIDTHS='Power=250,Supply=250'
PASS_A_PASSES=60
PASS_B_PASSES=150
STITCH=3.0
